<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="player" id="player">

    <header class="topbar">
      <h1>Music Player</h1>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <!-- Now playing card -->
    <section class="card">
      <div class="now">
        <img id="cover" class="cover" src="covers/cover1.png" alt="Album cover">
        <div class="info">
          <h2 id="title">Song title</h2>
          <p id="artist">Artist name</p>
        </div>
      </div>

      <div class="progress-wrap">
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="ctrl" aria-label="Previous song">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
        </button>
        <button id="playBtn" class="ctrl play" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg>
        </button>
      </div>

      <div class="volume">
        <button id="muteBtn" class="icon-btn" aria-label="Mute">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9z"/>
            <path class="wave" d="M16 8.5a5 5 0 0 1 0 7"/>
            <path class="mutex" d="M17 9l5 6M22 9l-5 6"/>
          </svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
      </div>
    </section>

    <!-- Playlist -->
    <section class="playlist-section">
      <h3>Playlist</h3>
      <ul id="playlist" class="playlist"></ul>
    </section>

    <p class="hint">Space = play/pause &nbsp;•&nbsp; ← → = seek &nbsp;•&nbsp; N / P = next / previous</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
